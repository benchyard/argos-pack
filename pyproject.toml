[project]
name = "argos-pack-examples"
version = "0.1.0"
description = "Portable health and preview checks for Argos"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["argospy>=0.6.3,<0.7"]

[project.entry-points."argos.packs"]
webdemo = "argos_examples:pack"

[project.urls]
Repository = "https://github.com/benchyard/argos-pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argos_examples"]
